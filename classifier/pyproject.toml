[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "steering-classificator"
version = "0.1.0"
description = "Classifier for differential equation types."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "joblib>=1.3",
    "openpyxl>=3.1",
    "pandas>=2.0",
    "scikit-learn>=1.4",
    "torch>=2.3",
]

[project.scripts]
train-equation-classifier = "steering_classificator.train:main"
predict-equation-type = "steering_classificator.predict:main"

[tool.setuptools.packages.find]
where = ["src"]
